name: iOS E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_THOUGHTS_API_URL: https://example.invalid
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: e2e-ios-client
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: e2e-web-client

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate iOS project
        working-directory: artifacts/voice-recorder
        run: pnpm prebuild:ios

      - name: Install Maestro
        run: curl -Ls https://get.maestro.mobile.dev | bash

      - name: Build and run smoke test
        working-directory: artifacts/voice-recorder
        run: |
          device_id="$(
            xcrun simctl list devices available --json |
              jq --raw-output '.devices[][] | select(.name | startswith("iPhone")) | .udid' |
              head -n 1
          )"
          test -n "$device_id"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" --block

          xcodebuild \
            -workspace ios/thoughts.xcworkspace \
            -scheme thoughts \
            -configuration Debug \
            -destination "id=$device_id" \
            -derivedDataPath ios/build-e2e \
            CODE_SIGNING_ALLOWED=NO \
            build

          app_path="ios/build-e2e/Build/Products/Debug-iphonesimulator/thoughts.app"
          test -d "$app_path"
          xcrun simctl install "$device_id" "$app_path"
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --device "$device_id" test e2e/smoke.yaml
